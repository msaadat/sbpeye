[project]
name = "sbpeye"
version = "0.2.0"
description = "Independent SBP Circulars & EcoData Indexer with AI-powered analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "chromadb>=1.5.9",
    "click>=8.1.0",
    "cloudscraper",
    "argon2-cffi>=23.1.0",
    "fastapi>=0.136.3",
    "itsdangerous>=2.2.0",
    "fastembed>=0.7.4",
    "onnxruntime>=1.26.0",
    "jinja2>=3.1.6",
    "openai>=2.38.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pdfplumber>=0.11.9",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.29",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.50",
    "uvicorn>=0.48.0",
]

[project.scripts]
sbpeye = "sbpeye.cli.commands:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
# Docling drives checklist reference-unit extraction, and it is the sole path to torch,
# transformers, opencv and — because uv resolves the CUDA build of torch — the entire
# NVIDIA runtime: 4.9 GB of a 5.8 GB virtualenv, on a target with no GPU. Every import of
# it is function-local in `checklist.py`, so the application starts and serves normally
# without it and only checklist generation is unavailable.
#
# Install it for local work with `uv sync --extra checklist`. The deployment image builds
# without it deliberately (deployment plan, 9.1.3).
checklist = ["docling>=2.104.0,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/sbpeye"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
